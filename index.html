<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Quiz Manager</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- NAVBAR -->
    <nav>
        
        <div class="logo" style="
    color:#ff4da6;
    font-size:32px;
    font-weight:900;
    letter-spacing:3px;
    text-transform:uppercase;
    text-shadow:0 0 10px #ff4da6, 0 0 20px #ff4da6, 0 0 30px #ff4da6;
    margin-right:auto;
    display:flex;
    align-items:center;
    gap:8px;
">
    ✧ Princess
</div>

        <a href="#" class="active" data-tab="player">Attempt Quiz</a>
        <a href="#" data-tab="designer">Designer</a>
        <a href="#" data-tab="manager">Manager</a>
    </nav>

    <!-- PLAYER -->
    <section id="player" class="container active">

        <div class="quiz-grid">

            <div class="card">

                <div class="quiz-header">
                    <span id="questionCounter">Question 1 of 1</span>
                </div>

                <div class="progress-wrapper">
                    <div id="progressBar"></div>
                </div>

                <h2 id="questionText">
                    Loading...
                </h2>

                <div id="optionsContainer"></div>

                <div class="quiz-buttons">

                    <button id="prevBtn" class="btn btn-outline">
                        ← Previous
                    </button>

                    <button id="nextBtn" class="btn btn-primary">
                        Next →
                    </button>

                </div>

            </div>

            <div class="card sidebar">

                <h3>Navigation</h3>

                <div id="navDots" class="nav-dots"></div>

                <button id="finishBtn" class="btn btn-primary full">
                    Finish Quiz
                </button>

                <div id="resultBox"></div>

            </div>

        </div>

    </section>

    <!-- DESIGNER -->
    <section id="designer" class="container">

        <div class="card">

            <h2 id="designerTitle">
                Add New Question
            </h2>

            <div class="form-group">
                <label>Pertanyaan</label>
                <textarea id="questionInput"></textarea>
            </div>

            <div class="options-grid">

                <div class="form-group">
                    <label>Option A</label>
                    <input type="text" id="optionA">
                </div>

                <div class="form-group">
                    <label>Option B</label>
                    <input type="text" id="optionB">
                </div>

                <div class="form-group">
                    <label>Option C</label>
                    <input type="text" id="optionC">
                </div>

                <div class="form-group">
                    <label>Option D</label>
                    <input type="text" id="optionD">
                </div>

                <div class="form-group">
                    <label>Option E</label>
                    <input type="text" id="optionD">
                </div>

            </div>

            <div class="form-group">

                <label>Jawaban Benar</label>

                <select id="correctAnswer">
                    <option value="0">Option A</option>
                    <option value="1">Option B</option>
                    <option value="2">Option C</option>
                    <option value="3">Option D</option>
                </select>

            </div>

            <div class="designer-buttons">

                <button id="saveQuestionBtn" class="btn btn-primary">
                    Save Question
                </button>

                <button id="cancelEditBtn" class="btn btn-outline hidden">
                    Cancel Edit
                </button>

            </div>

        </div>

    </section>

    <!-- MANAGER -->
    <section id="manager" class="container">

        <div class="card">

            <div class="manager-header">

                <h2>Question Manager</h2>

                <div class="manager-buttons">

                    <button id="exportBtn" class="btn btn-outline">
                        Export JSON
                    </button>

                    <textarea id="importText" placeholder="Tempel JSON di sini..." 
                    style="width:100%;height:150px;"></textarea>

                    <button id="importTextBtn">
                    Import JSON
                    </button>

                </div>

            </div>

            <div id="questionList"></div>

            <button id="deleteAllBtn" class="btn btn-danger full">
                Delete All Questions
            </button>

        </div>

    </section>

    <script src="script.js"></script>

    <canvas id="fx"></canvas>

<script>
const canvas = document.getElementById("fx");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

// =========================
// 🌌 STARS (DIM REDUCED BIAR BUNGA DOMINAN)
// =========================
const stars = [];

for (let i = 0; i < 40; i++) {
    stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.2,
        speed: Math.random() * 0.2 + 0.05
    });
}

// =========================
// 🌸 BIG FLOWER PETALS (CLEAR VISIBILITY)
// =========================
class Flower {
    constructor() {
        this.reset();
    }

    reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * -canvas.height;
        this.size = Math.random() * 10 + 6; // 🔥 lebih besar
        this.speedY = Math.random() * 1.2 + 0.8;
        this.speedX = Math.random() * 1 - 0.5;
        this.angle = Math.random() * 360;
        this.spin = Math.random() * 1.5 - 0.75;
        this.opacity = Math.random() * 0.7 + 0.5; // 🔥 lebih terlihat
        this.color = Math.random() > 0.5 ? "#ff4da6" : "#ff99cc";
    }

    update() {
        this.y += this.speedY;
        this.x += Math.sin(this.y * 0.008) * 1.2 + this.speedX;
        this.angle += this.spin;

        if (this.y > canvas.height + 50) {
            this.reset();
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle * Math.PI / 180);
        ctx.globalAlpha = this.opacity;

        // 🌸 GLOW biar terlihat jelas
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 15;

        ctx.fillStyle = this.color;

        // 🌸 REALISTIC PETAL SHAPE
        ctx.beginPath();

        // kelopak utama (lebih besar & jelas)
        ctx.moveTo(0, -this.size);
        ctx.bezierCurveTo(
            this.size, -this.size,
            this.size, this.size,
            0, this.size
        );
        ctx.bezierCurveTo(
            -this.size, this.size,
            -this.size, -this.size,
            0, -this.size
        );

        ctx.fill();
        ctx.restore();

        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
    }
}

// 🌸 CREATE FLOWERS (lebih sedikit tapi lebih terlihat)
const flowers = [];
for (let i = 0; i < 60; i++) {
    flowers.push(new Flower());
}

// =========================
// ✨ SPARKLE CLICK
// =========================
const sparks = [];

document.addEventListener("click", (e) => {
    for (let i = 0; i < 20; i++) {
        sparks.push({
            x: e.clientX,
            y: e.clientY,
            vx: (Math.random() - 0.5) * 7,
            vy: (Math.random() - 0.5) * 7,
            life: 70
        });
    }
});

// =========================
// 🎬 ANIMATION LOOP
// =========================
function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 🌌 stars (lebih redup)
    ctx.fillStyle = "white";
    stars.forEach(s => {
        ctx.globalAlpha = 0.3;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();

        s.y += s.speed;
        if (s.y > canvas.height) s.y = 0;
    });

    // 🌸 flowers (FOCUS UTAMA)
    flowers.forEach(f => {
        f.update();
        f.draw();
    });

    // ✨ sparks
    sparks.forEach((s, i) => {
        ctx.globalAlpha = 1;
        ctx.fillStyle = "#ff66cc";

        ctx.beginPath();
        ctx.arc(s.x, s.y, 2.5, 0, Math.PI * 2);
        ctx.fill();

        s.x += s.vx;
        s.y += s.vy;
        s.life--;

        if (s.life <= 0) sparks.splice(i, 1);
    });

    requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
